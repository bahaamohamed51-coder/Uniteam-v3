name: Build Android APK

# بناء ملف APK على خوادم GitHub بدون الحاجة لتثبيت أي شيء على جهازك.
# التشغيل: تبويب Actions ← Build Android APK ← Run workflow

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'رابط الموقع الذي يفتحه التطبيق (اتركه فارغاً لاستخدام رابط GitHub Pages تلقائياً)'
        required: false
        default: ''
      version_name:
        description: 'رقم الإصدار الظاهر للمستخدم'
        required: false
        default: '1.0'
      version_code:
        description: 'رقم الإصدار الداخلي (رقم صحيح، زِده مع كل نسخة جديدة)'
        required: false
        default: '1'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. جلب الكود ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. تجهيز البيئة ----------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ---------- 3. تثبيت الحزم ----------
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@^8.5.0 @capacitor/cli@^8.5.0 @capacitor/android@^8.5.0

      # ---------- 4. ضبط رابط الموقع داخل التطبيق ----------
      - name: Configure app URL
        run: |
          APP_URL="${{ inputs.app_url }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "التطبيق سيفتح: $APP_URL"
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.server = {
              url: process.argv[1],
              cleartext: true,
              androidScheme: 'https'
            };
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log(fs.readFileSync(path, 'utf8'));
          " "$APP_URL"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      # ---------- 5. بناء ملفات الويب ----------
      - name: Build web assets
        run: npm run build

      # ---------- 6. إنشاء مشروع أندرويد ----------
      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "مجلد android موجود مسبقاً - سيتم استخدامه"
          else
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # ---------- 7. ضبط رقم الإصدار ----------
      - name: Set version
        run: |
          VN="${{ inputs.version_name }}"
          VC="${{ inputs.version_code }}"
          [ -z "$VN" ] && VN="1.0"
          [ -z "$VC" ] && VC="1"
          sed -i "s/versionCode .*/versionCode ${VC}/"       android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # ---------- 8. بناء APK ----------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # ---------- 9. تجهيز الملف الناتج ----------
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Uniteam-Attendance.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uniteam-Attendance-APK
          path: output/Uniteam-Attendance.apk
          retention-days: 90
          if-no-files-found: error

      # ---------- 10. ملخص ----------
      - name: Summary
        if: success()
        run: |
          SIZE=$(du -h output/Uniteam-Attendance.apk | cut -f1)
          {
            echo "## تم بناء ملف APK بنجاح"
            echo ""
            echo "| البيان | القيمة |"
            echo "| --- | --- |"
            echo "| اسم الملف | Uniteam-Attendance.apk |"
            echo "| الحجم | ${SIZE} |"
            echo "| الإصدار | ${{ inputs.version_name }} (${{ inputs.version_code }}) |"
            echo "| الرابط داخل التطبيق | ${APP_URL} |"
            echo ""
            echo "### مكان التحميل"
            echo ""
            echo "انزل إلى **أسفل هذه الصفحة** وستجد قسم **Artifacts**، وبداخله عنصر باسم **Uniteam-Attendance-APK**."
            echo ""
            echo "ما يُحمَّل هو ملف **ZIP** — فك ضغطه لتجد ملف APK بالداخل."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure hint
        if: failure()
        run: |
          {
            echo "## فشل البناء"
            echo ""
            echo "افتح الخطوة الحمراء أعلاه واقرأ آخر الأسطر لمعرفة السبب."
          } >> "$GITHUB_STEP_SUMMARY"
