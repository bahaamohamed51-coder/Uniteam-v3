<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Uniteam</title>
  <style>
    /*
      صفحة بديلة لصفحة الخطأ الافتراضية في WebView.
      كل شيء بداخلها مضمّن: لا صور خارجية ولا خطوط من الإنترنت،
      لأنها تظهر تحديداً حين ينقطع الاتصال.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "Noto Naskh Arabic", sans-serif;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }

    .card { width: 100%; max-width: 340px; }

    .logo { margin-bottom: 28px; }

    h1 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f1f5f9;
    }

    p {
      font-size: 15px;
      line-height: 1.9;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }

    button:active { background: #1d4ed8; transform: scale(.98); }
    button:disabled { opacity: .6; }

    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.9;
    }

    .dot {
      display: inline-block;
      width: 7px; height: 7px;
      margin-inline-end: 7px;
      border-radius: 50%;
      background: #ef4444;
      vertical-align: middle;
    }

    .dot.online { background: #22c55e; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 15px; height: 15px;
      margin-inline-start: 9px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- الشعار مرسوم بـ SVG داخل الصفحة، فلا يعتمد على أي ملف صورة -->
    <div class="logo">
      <svg width="104" height="104" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="100" height="100" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <circle cx="52" cy="46" r="25" stroke="#64748b" stroke-width="3.5" fill="none"/>
        <path d="M52 32 V46 L61 53" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="44" cy="74" r="8" fill="#475569"/>
        <path d="M30 92 C30 83 36.5 78 44 78 C51.5 78 58 83 58 92" fill="#475569"/>
        <path d="M70 66 C77 66 82 71.5 82 78 C82 86 70 95 70 95 C70 95 58 86 58 78 C58 71.5 63 66 70 66 Z" fill="#334155" stroke="#64748b" stroke-width="2.5"/>
        <path d="M65 78 L69 82 L76 74" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="22" y1="22" x2="82" y2="82" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
      </svg>
    </div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يحتاج التطبيق إلى اتصال لتحميل بياناتك.<br>فعّل بيانات الهاتف أو الواي فاي ثم أعد المحاولة.</p>

    <button id="retry" type="button">إعادة المحاولة</button>

    <div class="hint">
      <span class="dot" id="dot"></span>
      <span id="status">جارٍ التحقق من الاتصال…</span>
    </div>
  </div>

  <script>
    (function () {
      var btn    = document.getElementById('retry');
      var dot    = document.getElementById('dot');
      var status = document.getElementById('status');

      function render() {
        if (navigator.onLine) {
          dot.className = 'dot online';
          status.textContent = 'عاد الاتصال — اضغط إعادة المحاولة';
        } else {
          dot.className = 'dot';
          status.textContent = 'الجهاز غير متصل بالإنترنت';
        }
      }

      btn.addEventListener('click', function () {
        btn.disabled = true;
        btn.innerHTML = 'جارٍ إعادة التحميل<span class="spinner"></span>';
        // إعادة تحميل الصفحة تعيد المحاولة على رابط التطبيق الأصلي
        setTimeout(function () { location.reload(); }, 250);
      });

      window.addEventListener('online', render);
      window.addEventListener('offline', render);
      render();

      // فحص دوري: بمجرد عودة الاتصال يُعاد التحميل تلقائياً
      setInterval(function () {
        if (navigator.onLine && !btn.disabled) {
          render();
        }
      }, 3000);
    })();
  </script>
</body>
</html>
